minimum_pre_commit_version: 4.0.0
exclude: ^LICENSES/|\.(html|csv|svg|png)$

default_stages: [pre-commit]
ci:
  autofix_prs: false
  autoupdate_schedule: monthly

repos:
  # pre-commit 基础检查
  - repo: https://gitcode.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # md 保留行尾双空格（markdown 硬换行语法），其余尾随空白照删
        args: ["--markdown-linebreak-ext=md"]
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-json

  # Python 代码检查
  - repo: https://gitcode.com/gh_mirrors/ru/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff-check
        args: ["--output-format", "github", "--fix", "--unsafe-fixes", "--ignore", "E501,RUF001,RUF002,RUF003,E402,E701,E702,N815"]
        types: [python]
      - id: ruff-format
        types: [python]

  # 拼写检查
  - repo: https://gitcode.com/gh_mirrors/co/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        # 包装 entry：输出 tee 到 pre-commit_reports/codespell.log（仍跑在托管 venv）
        entry: bash scripts/run_codespell.sh
        args: [
            "-L",
            "CANN,cann,ascend,Ascend,tbe,EnQue,CopyIn,nd2nz,ND,NZ,NNAL,nnal,ASCEND,ArchType,AND,ND,nd,te,copyin,alog,wIh,dout,indexs,inH,padD,outWeight,vor,invokable,VALU,LastR,nin,COO,registe,CLen,REGIST,fo,subtile,rIn,IndexT,ot,iput,datas",
            "--skip",
            "*.py,*.sample,*.cc,*.cjs,*.clang-format,*.cmake,*.cpp,*.csv,*.cts,*.gitignore,*.gitkeep,*.gitmodules,*.h,*.hpp,*.in,*.info,*.ini,*.js,*.json,*.jsonl,*.log,*.sh,*.TAG,*.ts,*.tsx,*.txt,*.xml",
          ]

  # OAT 合规性检查 (Open Source Audit Tool)
  - repo: local
    hooks:
      - id: oat-check
        name: OAT Compliance Check
        entry: bash scripts/oat_check.sh
        language: system
        pass_filenames: true
        require_serial: true
        types: [file]
        stages: [commit]
        verbose: true
