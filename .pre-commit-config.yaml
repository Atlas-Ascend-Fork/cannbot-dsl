minimum_pre_commit_version: 4.0.0
exclude: ^LICENSES/|\.(html|csv|svg|png)$

default_stages: [pre-commit]
ci:
  autofix_prs: false
  autoupdate_schedule: monthly

repos:
  # pre-commit 基础检查
  - repo: https://gitcode.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # md 保留行尾双空格（markdown 硬换行语法），其余尾随空白照删
        args: ["--markdown-linebreak-ext=md"]
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-json

  # Python 代码检查
  - repo: https://gitcode.com/gh_mirrors/ru/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff-check
        args: ["--output-format", "github", "--fix", "--unsafe-fixes", "--ignore", "E501,RUF001,RUF002,RUF003,E402,E701,E702,N815,F821"]
        types: [python]
      - id: ruff-format
        types: [python]

  # 拼写检查
  - repo: https://gitcode.com/gh_mirrors/co/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        # 只查 markdown（files 过滤后 --skip 不再需要）
        files: \.md$
        entry: bash scripts/run_codespell.sh
        args: [
            "-L",
            "CANN,cann,ascend,Ascend,tbe,EnQue,CopyIn,nd2nz,ND,NZ,NNAL,nnal,ASCEND,ArchType,AND,ND,nd,te,copyin,alog,wIh,dout,indexs,inH,padD,outWeight,vor,invokable,VALU,LastR,nin,COO,registe,CLen,REGIST,fo,subtile,rIn,IndexT,ot,iput,datas",
          ]
  - repo: https://gitcode.com/HiAgent/compliance
    rev: v1.0.6
    hooks:
      - id: oat-check
        pass_filenames: true
        stages: [pre-commit]
        verbose: true
