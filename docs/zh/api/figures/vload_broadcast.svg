<svg xmlns="http://www.w3.org/2000/svg" width="772" height="172" viewBox="0 0 772 172" role="img" aria-labelledby="vload-broadcast-title vload-broadcast-desc">
  <title id="vload-broadcast-title">广播搬入矢量数据寄存器</title>
