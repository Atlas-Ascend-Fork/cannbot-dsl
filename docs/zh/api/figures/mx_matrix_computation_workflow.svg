  <g fill="#5277ff"><rect x="10" y="15" width="63" height="312"/><rect x="960" y="15" width="63" height="312"/></g>
  <g font-family="FZLanTingHei-R-GBK, 方正兰亭黑_GBK, sans-serif" font-size="12" text-anchor="middle">
    <text x="41" y="178" fill="#fff">GM</text><text x="991" y="178" fill="#fff">GM</text>
    <use href="#mx-flow-l1" x="182" y="46"/><use href="#mx-flow-l1" x="182" y="89"/><use href="#mx-flow-l1" x="182" y="127"/>
    <use href="#mx-flow-l1" x="182" y="165"/><use href="#mx-flow-l1" x="182" y="218"/><use href="#mx-flow-l1" x="182" y="265"/>
    <g fill="#e9edff" stroke="#5277ff" stroke-width="0.8">
      <rect x="418" y="46" width="111" height="38"/><rect x="418" y="90" width="111" height="25" stroke-dasharray="3 4"/>
      <rect x="418" y="127" width="111" height="38"/><rect x="418" y="176" width="111" height="26" stroke-dasharray="3 4"/>
      <rect x="418" y="218" width="111" height="26"/><rect x="418" y="269" width="111" height="27"/>
      <rect x="682" y="136" width="100" height="74"/>
    </g>
    <g fill="#101843">
      <text x="474" y="70">L0A Buffer</text><text x="474" y="107">L0A_MX Buffer</text>
      <text x="474" y="151">L0B Buffer</text><text x="474" y="194">L0B_MX Buffer</text>
      <text x="474" y="236">BT Buffer</text><text x="474" y="287">FP Buffer</text><text x="732" y="178">L0C Buffer</text>
    </g>
    <g fill="none" stroke="#17b7a6" stroke-width="0.7"><ellipse cx="619" cy="173" rx="32" ry="35"/><ellipse cx="852" cy="173" rx="29" ry="22"/></g>
    <g fill="#101843" font-size="10">
      <text x="619" y="167">matmul</text><text x="619" y="183" font-size="9">mx_mode=True</text><text x="852" y="177">mem_copy</text>
    </g>
    <g fill="#101843" font-size="10" text-anchor="start">
      <text x="89" y="52">mem_copy</text><text x="89" y="96">mem_copy</text><text x="89" y="135">mem_copy</text>
      <text x="89" y="173">mem_copy</text><text x="89" y="226">mem_copy</text><text x="89" y="273">mem_copy</text>
      <text x="303" y="53">mem_copy</text><text x="276" y="96">mem_copy + mx_scale</text>
      <text x="303" y="135">mem_copy</text><text x="276" y="173">mem_copy + mx_scale</text>
      <text x="303" y="226">mem_copy</text><text x="270" y="274">convert(..., scale=...)</text>
      <text x="89" y="317">根据场景选择相应接口</text>
    </g>
  </g>
