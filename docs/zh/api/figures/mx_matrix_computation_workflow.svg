<svg xmlns="http://www.w3.org/2000/svg" width="1032" height="348" viewBox="0 0 1032 348" role="img" aria-labelledby="mx-flow-title mx-flow-desc" font-family="FZLanTingHei-R-GBK, 方正兰亭黑_GBK, sans-serif">
  <title id="mx-flow-title">MX矩阵基础计算流程图</title>
  <desc id="mx-flow-desc">A、ScaleA、B、ScaleB、Bias与随路量化数据从GM经L1进入各自Buffer；MX矩阵乘加输出L0C，经结果搬运回到GM。MX系数加载由数据搬运的mx_scale选项表达，所有图形和文本均可编辑。</desc>
  <defs>
    <marker id="mx-flow-arrow" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3L0 6Z" fill="#171717"/></marker>
    <marker id="mx-flow-blue-arrow" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3L0 6Z" fill="#5277ff"/></marker>
    <g id="mx-flow-l1"><rect width="80" height="28" fill="#e9edff" stroke="#5277ff" stroke-width="0.8"/><text x="40" y="18" fill="#101843" font-size="12" text-anchor="middle">L1 Buffer</text></g>
  </defs>
  <rect width="1032" height="348" fill="#fff"/>
  <g fill="#fff" stroke="#111843" stroke-width="0.7">
    <rect x="141" y="2" width="793" height="314" rx="8"/><rect x="131" y="15" width="793" height="314" rx="8"/><rect x="86" y="29" width="813" height="313" rx="8"/>
  </g>
  <rect x="94" y="37" width="800" height="297" fill="#eef0f3"/>
