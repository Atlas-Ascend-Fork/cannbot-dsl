<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="528" viewBox="0 0 1120 528" role="img" aria-labelledby="mx-b-title mx-b-desc">
  <title id="mx-b-title">scaleB矩阵在不同位置上的排布格式</title>
  <desc id="mx-b-desc">左侧给出scaleB不转置和转置时的GM配对存储，分别通过ND2NZ.b16和DN2NZ.b16转换为右侧的Nn分形。分形为2×16，两个量化系数占2 Byte。全部标签、网格、箭头与背景带均可编辑。</desc>
