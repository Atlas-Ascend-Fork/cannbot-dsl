    <g id="mx-b-column" fill="none"><path d="M10 14L4 130" stroke="#f2b8b8" stroke-width="8" opacity="0.8"/><path d="M0 14H19L0 130H19" stroke="#333" stroke-width="0.8" marker-mid="url(#mx-b-small)" marker-end="url(#mx-b-small)"/></g>
