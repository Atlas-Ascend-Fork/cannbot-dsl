<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc"><title id="title">卷积权重从 OIHW 到 L1 的三维排布变换</title><desc id="desc">左侧每个输出通道对应I乘Kh乘Kw的权重体。中间将I切为每组16通道。右侧每个I1组重排为以I0为宽、输出通道O为深、Kh乘Kw为高的权重体，依次存放。所有立方体是维度折叠示意，不表示真实大小比例。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8c98a8"/></marker><marker id="dim" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse"><path d="M6 3L0 0L0 6Z" fill="#677487"/></marker></defs><rect width="1280" height="650" fill="white"/><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#26374b;font-size:18px}.head{font-size:22px;font-weight:600}.small{font-size:15px}.dim{font-size:19px}</style>
