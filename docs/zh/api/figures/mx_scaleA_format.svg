    <marker id="mx-a-arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L5 2.5L0 5Z" fill="#222"/></marker>
    <marker id="mx-a-small" markerWidth="4" markerHeight="4" refX="3.5" refY="2" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L4 2L0 4Z" fill="#333"/></marker>
    <g id="mx-a-row" fill="none" stroke="#333" stroke-width="0.8" marker-end="url(#mx-a-small)"><path d="M5 0H25"/><path d="M32 0H52"/><path d="M59 0H79"/><path d="M123 0H143"/></g>
    <g id="mx-a-column" fill="none"><path d="M10 14L4 130" stroke="#f2b8b8" stroke-width="8" opacity="0.8"/><path d="M0 14H19L0 130H19" stroke="#333" stroke-width="0.8" marker-mid="url(#mx-a-small)" marker-end="url(#mx-a-small)"/></g>
    <g id="mx-a-z" fill="none" stroke="#222" stroke-width="0.8"><path d="M5 3V43L50 3V43" marker-mid="url(#mx-a-small)" marker-end="url(#mx-a-small)"/></g>
    <g id="mx-a-mini" fill="none" stroke="#222" stroke-width="0.65">
      <path d="M2 3H14L2 43H14" marker-mid="url(#mx-a-small)" marker-end="url(#mx-a-small)"/>
      <path d="M2 51H14L2 91H14" marker-mid="url(#mx-a-small)" marker-end="url(#mx-a-small)"/>
      <path d="M2 99H14L2 139H14" marker-mid="url(#mx-a-small)" marker-end="url(#mx-a-small)"/>
    </g>
  </defs>
  <rect width="1120" height="557" fill="#fff"/>
  <g font-family="FZLanTingHei-R-GBK, 方正兰亭黑_GBK, sans-serif" font-size="13" fill="#071429">
    <g stroke="#777" stroke-width="0.8"><rect x="214.5" y="43.5" width="306" height="54" rx="11" fill="#fff"/><rect x="546.5" y="43.5" width="494" height="54" fill="#fff"/></g>
