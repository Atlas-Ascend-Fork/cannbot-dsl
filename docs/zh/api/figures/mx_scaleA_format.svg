<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="557" viewBox="0 0 1120 557" role="img" aria-labelledby="mx-a-title mx-a-desc">
  <title id="mx-a-title">scaleA矩阵在不同位置上的排布格式</title>
  <desc id="mx-a-desc">左侧给出scaleA不转置和转置时的GM配对存储，分别通过DN2NZ.b16和ND2NZ.b16转换为右侧的Zz分形。分形为16×2，两个量化系数占2 Byte。全部标签、网格、箭头与背景带均可编辑。</desc>
