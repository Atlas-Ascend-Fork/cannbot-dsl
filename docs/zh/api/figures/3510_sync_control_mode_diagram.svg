    <rect x="16" y="20" width="186" height="78"/>
    <rect x="16" y="106" width="186" height="85"/>
    <rect x="219" y="20" width="187" height="78"/>
    <rect x="219" y="106" width="187" height="85"/>
    <rect x="423" y="20" width="186" height="78"/>
    <rect x="423" y="106" width="186" height="85"/>
    <rect x="628" y="20" width="187" height="78"/>
    <rect x="628" y="106" width="187" height="85"/>
  </g>
  <g fill="#c1d5ff">
    <rect x="69.5" y="37.5" width="74" height="52" rx="3"/>
    <rect x="272.5" y="37.5" width="74" height="52" rx="3"/>
    <rect x="475.5" y="37.5" width="74" height="52" rx="3"/>
    <rect x="678.5" y="37.5" width="74" height="52" rx="3"/>
  </g>
  <g fill="#adf0e3">
    <rect x="25.5" y="127.5" width="74" height="52" rx="2"/>
    <rect x="119.5" y="127.5" width="74" height="52" rx="2"/>
    <rect x="228.5" y="127.5" width="74" height="52" rx="2"/>
    <rect x="322.5" y="127.5" width="74" height="52" rx="2"/>
    <rect x="431.5" y="127.5" width="74" height="52" rx="2"/>
    <rect x="525.5" y="127.5" width="74" height="52" rx="2"/>
    <rect x="634.5" y="127.5" width="74" height="52" rx="2"/>
    <rect x="728.5" y="127.5" width="74" height="52" rx="2"/>
  </g>
  <g fill="none" stroke="#7a87ff" stroke-width="1">
    <rect x="9" y="12" width="810" height="86"/>
    <rect x="9" y="105" width="810" height="97"/>
    <rect x="225" y="108" width="178" height="80"/>
    <rect x="423" y="20" width="186" height="168"/>
