<svg xmlns="http://www.w3.org/2000/svg" width="833" height="210" viewBox="0 0 833 210" role="img" aria-labelledby="title desc">
  <title id="title">Four inter-core synchronization modes</title>
  <desc id="desc">Reconstructed from the original diagram. Mode 0 spans all AICs or all AIVs; mode 1 spans two AIVs within a core; mode 2 spans an AIC and its two AIVs; mode 4 spans an AIC and one AIV.</desc>
