    <text x="512.5" y="69">AIC 2</text><text x="715.5" y="69">AIC N-1</text>
    <text x="62.5" y="158">AIV 0-0</text><text x="156.5" y="158">AIV 0-1</text>
    <text x="265.5" y="158">AIV 1-0</text><text x="359.5" y="158">AIV 1-1</text>
    <text x="468.5" y="158">AIV 2-0</text><text x="562.5" y="158">AIV 2-1</text>
