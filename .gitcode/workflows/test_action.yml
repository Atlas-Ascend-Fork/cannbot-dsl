name: test_action

on:
  workflow_call:

jobs:
  JOB_test:
    name: Test
    steps:
      -
        name: Checkout
        identifier: process_checkout
        uses: checkout
        with:
          ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
          allow-unsafe-pr-checkout: true
      -
        name: oidc_auth
        uses: huaweicloud-oidc-auth
        with:
          audience: ${{ secrets.audience }}
          agency_urn: ${{ secrets.agency_urn }}
          provider_urn: ${{ secrets.provider_urn }}
          region: cn-north-4
          duration: 3600
      -
        name: download_pr_filelist
        uses: obs-download
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          key: ${{ env.obs_path }}/pr_filelist.txt
          path: ${{ steps.process_checkout.outputs.path }}
      -
        name: run_tests
        identifier: run_tests
        env:
          CI_TEST_WORKERS: '16'
        run: |
          cd ${{ steps.process_checkout.outputs.path }}
          set +e
          bash build.sh --mode=ci --changed-list=pr_filelist.txt
          test_rc=$?
          set -e
          if [[ "$test_rc" -ne 0 ]]; then
            echo "[ERROR] Test failed with exit code $test_rc. See the errors above."
          else
            echo "[INFO] Test completed successfully."
          fi
          exit "$test_rc"
      -
        name: upload_results
        if: ${{ always() && steps.run_tests.outputs.perf_archive != '' }}
        uses: obs-upload
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          artifact-path: ${{ steps.run_tests.outputs.perf_archive }}
          object-prefix: ${{ env.obs_path }}/perf_results/${{ steps.run_tests.outputs.perf_run_id }}
    if: "${{ !atomgit.event.pull_request.number || (atomgit.event.pull_request.state == 'open' && atomgit.event.pull_request.merged != true && !atomgit.event.pull_request.merged_at) }}"
    runs-on: ['self-hosted', 'os=ubuntu', 'evb=a5', 'repo=dsl']
